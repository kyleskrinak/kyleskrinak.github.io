DirectoryPath: "dist"
CheckExternal: true
CheckInternal: true
IgnoreCanonicalBrokenLinks: false
IgnoreAltMissing: false
# alt="" is the correct markup for a decorative or placeholder image, and this
# site has three: the lightbox <img> placeholder (script sets alt on open), the
# hidden microformats u-photo in PostDetails, and the homepage footer h-card
# photo. htmltest counts every one as "alt text empty", which put 99 errors in
# every run and made tier 1 structurally unpassable — the early-exit fast path
# in check-links.js was dead code and each run paid the full external sweep.
# This flag permits an intentional empty alt while a genuinely MISSING alt
# attribute is still an error (verified), so no real defect class is lost.
IgnoreAltEmpty: true
IgnoreDirectoryMissingTrailingSlash: true
IgnoreURLs:
  - "onedrive.live.com"  # Bot detection, works in real browsers
  - "nytimes.com"  # Aggressive rate limiting, works in real browsers
  - "windowsupdate.microsoft.com"  # Windows Update client endpoint, not web-accessible
  - "web.archive.org"  # Archive.org can be slow, exceeds ExternalTimeout
  - "alessio.franceschelli.me"  # Slow response times, exceeds ExternalTimeout
  - "about.gitlab.com"  # Connection reset in htmltest, works in browser
  - "claude.ai"  # Connection reset in htmltest, works in browser
  - "drupal.org/u/grasmash"  # Intermittent timeouts, works in real browsers
  - "linkedin.com"  # Bot detection (999/404 to crawlers), works in real browsers
  - "hhs.gov"  # Bot detection (403 to crawlers), works in real browsers
  - "autohotkey.com"  # Bot detection (403 to crawlers), works in real browsers
  - "substack.com"  # Bot detection (403 to crawlers), works in real browsers
  - "medium.com"  # Bot detection (403 to crawlers), works in real browsers
  - "ahajournals.org"  # Bot detection (403 to crawlers), works in real browsers
  - "manager-tools.com"  # Bot detection (403 to crawlers), works in real browsers
  - "tuitnutrition.com"  # Bot detection — hangs Playwright (Chromium and WebKit, up to 60s), 0.4s in curl/real browsers
  - "xn--sr8hvo.ws/previous"  # Webring: 302s to random member sites; dead members would fail CI nondeterministically
  - "xn--sr8hvo.ws/next"  # Webring: 302s to random member sites; dead members would fail CI nondeterministically
  - "webmention.io"  # Unclaimed until IndieAuth signup; also a POST-only receiver, so link-checker GET/HEAD requests will 4xx even once correctly configured
IgnoreInternalURLs:
  # These PDFs are .gitignored and absent from a plain `npm run build`; the
  # deploy pipeline guarantees them via the ensure-release-pdfs action's
  # presence guards, so ignoring them here cannot mask a production regression.
  - "/blog-archive.pdf"
  - "/presentations-archive.pdf"
  - "/resume/kyle-skrinak-resume.pdf"
