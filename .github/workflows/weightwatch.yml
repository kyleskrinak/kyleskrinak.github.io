name: Weightwatch (live page weight monitor)

on:
  schedule:
    # Nightly UTC; adjust if you prefer a different time.
    - cron: "47 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: weightwatch
  cancel-in-progress: true

jobs:
  weightwatch:
    name: Check live page weight against production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        # Pinned to SHA (v4) — consistent supply-chain posture across all workflows.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-build

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run live page weight check
        id: check-weight
        run: |
          set +e
          npm run check:live-weight > weight-report.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat weight-report.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            exit "$code"
          fi
          exit 0

      # If the weight check step found the site over budget, create/update
      # a single tracking issue.
      - name: Create or update page weight report issue
        if: steps.check-weight.outputs.exit_code == '1'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('weight-report.txt', 'utf8');
            report = report.replace(/`/g, "'");
            if (report.length > 60000) {
              report = report.slice(0, 60000) + '\n... (truncated)';
            }
            const title = "Live page weight report";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body =
              `Nightly live page weight check found the production homepage over budget.\n\n` +
              `- Workflow run: ${runUrl}\n` +
              `- Branch/ref: ${context.ref}\n` +
              `- Commit: ${context.sha}\n\n` +
              `Report:\n\`\`\`\n${report}\n\`\`\`\n\n` +
              `This measures uncompressed bytes (512KB Club methodology) of a cold load of ` +
              `https://kyle.skrinak.com/, including third-party trackers (Google Tag Manager, ` +
              `Cloudflare Insights, etc.) that don't exist in the local build output; transfer ` +
              `bytes are also reported. It is informational only — it does not block deploys.`;

            // Find an existing open issue with the exact title.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }
