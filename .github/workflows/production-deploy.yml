name: Production (AWS S3 + CloudFront)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, verify, deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kyle.skrinak.com
    permissions:
      contents: write # ensure-release-pdfs reads/writes the release backing stores
      id-token: write # needed for OIDC -> AWS
    # One canonical site URL for the whole job. The PDF builders need it as much
    # as the site build does, and step-level env does not reach the `run:` steps
    # inside a composite action, so scoping it per-step left the PDF step relying
    # on the script's fallback instead of this value.
    env:
      SITE_URL: https://kyle.skrinak.com/
    steps:
      - name: Checkout
        # Pinned to SHA (v4) — consistent supply-chain posture across all workflows.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-build

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration registry
        run: npm run config:validate

      - name: Check Cloudflare production token presence
        # Informational only — logs presence/absence but does not fail the build.
        # Enforcement (exit 1 on missing) is in secrets-check.yml (workflow_dispatch).
        run: |
          if [ -n "${PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN:-}" ]; then
            echo "Cloudflare production token is set (masked)."
          else
            echo "Cloudflare production token is NOT set."
          fi
        env:
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_PROD }}

      - name: Build site
        run: npm run build:ci
        env:
          BUILD_ENV: production
          SITE_URL: https://kyle.skrinak.com/
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_PROD }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION_PROD }}

      # Runs AFTER the build: renders the PDFs from the built dist/ and writes
      # them into dist/ so the S3 sync picks them up. Production uses the
      # archive-pdfs / resume-pdf release tags as its backing stores.
      - name: Ensure archive PDFs
        uses: ./.github/actions/ensure-release-pdfs
        # SITE_URL comes from the job-level env above. The presentations PDF
        # assembles its pages at the local server root, so it has no rendered
        # page to read the public origin from and needs that value.
        # build-archive-pdf.mjs deliberately ignores it: it reads the origin out
        # of the print CSS of the page it is rendering, so the links it rewrites
        # and the URLs that page suppresses cannot disagree.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: archive-pdfs
          title: Archive PDFs (automation backing store)
          hash-paths: |
            src/content/blog
            public/presentations
            src/pages/archive-book.astro
            src/utils/getBlogPosts.ts
            src/utils/postFilter.ts
            src/content.config.ts
            scripts/build-archive-pdf.mjs
            scripts/build-presentations-pdf.mjs
            scripts/lib/pdf-helpers.mjs
            src/config
          assets: |
            blog-archive.pdf dist
            presentations-archive.pdf dist
          regen-command: |
            npm run archive:pdf -- --skip-build --output dist/blog-archive.pdf
            npm run archive:presentations -- --output dist/presentations-archive.pdf

      # The resume hash list includes the shared rendering inputs the print
      # route renders through (Layout, global CSS, site config, content
      # schema) — a change to any of these alters the printed page. It also
      # includes the placeholder expanders, which build the lead heading,
      # employer lines and education section out of the frontmatter: a change
      # there rewrites the printed text even when the resume source is untouched.
      # astro.config.ts churns ~monthly → ~one spurious regen/month; accepted tradeoff.
      - name: Ensure resume files
        uses: ./.github/actions/ensure-release-pdfs
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: resume-pdf
          title: Resume PDF (automation backing store)
          hash-paths: |
            src/content/pages/resume
            src/pages/resume/print/index.astro
            src/styles/resume.css
            scripts/print-resume-pdf.mjs
            scripts/lib/resume-render.mjs
            scripts/lib/resume-formats.mjs
            scripts/lib/resume-docx.mjs
            scripts/lib/resume-source.mjs
            scripts/lib/pdf-helpers.mjs
            src/lib/remark-facets.mjs
            src/lib/remark-resume-sections.mjs
            src/lib/resume-sections.mjs
            src/components/ResumeHeader.astro
            src/layouts/Layout.astro
            src/styles/global.css
            src/config
            src/content.config.ts
            astro.config.ts
          # One render writes all three (print-resume-pdf.mjs defaults to
          # --formats pdf,docx,txt), so they always carry the same content.
          assets: |
            kyle-skrinak-resume.pdf dist/resume
            kyle-skrinak-resume.docx dist/resume
            kyle-skrinak-resume.txt dist/resume
          regen-command: |
            node scripts/print-resume-pdf.mjs --output dist/resume/kyle-skrinak-resume.pdf

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 1: push long-lived assets first
      - name: Sync assets to S3 (1y immutable)
        run: |
          aws s3 sync "dist/" "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --only-show-errors \
            --exclude "*" \
            --include "_astro/*" \
            --include "_pagefind/*" \
            --cache-control "max-age=31536000,public,immutable"

      # Step 2: push everything else (HTML + non-asset files) with a short cache
      # Excluding assets prevents this step from overwriting the long-lived headers from step 1.
      # The resume's .docx and .txt are excluded too and copied after with an
      # explicit Content-Type: the CLI guesses types from the runner's mime
      # table, which can label a .docx application/octet-stream and gives a
      # .txt no charset. An excluded key survives --delete.
      - name: Sync HTML to S3 (5m cache)
        run: |
          aws s3 sync "dist/" "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --only-show-errors \
            --exclude "_astro/*" \
            --exclude "_pagefind/*" \
            --exclude "resume/kyle-skrinak-resume.docx" \
            --exclude "resume/kyle-skrinak-resume.txt" \
            --cache-control "max-age=300,public"
          aws s3 cp "dist/resume/kyle-skrinak-resume.docx" \
            "s3://${{ vars.AWS_S3_BUCKET }}/resume/kyle-skrinak-resume.docx" \
            --only-show-errors \
            --content-type "application/vnd.openxmlformats-officedocument.wordprocessingml.document" \
            --cache-control "max-age=300,public"
          aws s3 cp "dist/resume/kyle-skrinak-resume.txt" \
            "s3://${{ vars.AWS_S3_BUCKET }}/resume/kyle-skrinak-resume.txt" \
            --only-show-errors \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "max-age=300,public"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/"
