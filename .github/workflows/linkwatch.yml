name: Linkwatch (two-tier link checking)

on:
  schedule:
    # Nightly UTC; adjust if you prefer a different time.
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: linkwatch
  cancel-in-progress: true

jobs:
  linkwatch:
    name: Build site + two-tier link check (htmltest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        # Pinned to SHA (v4) — consistent supply-chain posture across all workflows.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-build

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install htmltest
        env:
          HTMLTEST_VERSION: "0.17.0"
        run: |
          curl -fsSL -o htmltest.tar.gz "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          tar -xzf htmltest.tar.gz
          sudo mv htmltest /usr/local/bin/
          htmltest --version

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run two-tier link check (htmltest + Playwright)
        id: check-links
        env:
          PLAYWRIGHT_HEADED: false
        run: |
          set +e
          npm run check:links > link-report.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat link-report.txt
          exit 0

      # If the link check step fails, create/update a single tracking issue.
      - name: Create or update link rot report issue
        if: steps.check-links.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('link-report.txt', 'utf8');
            report = report.replace(/`/g, "'");
            if (report.length > 60000) {
              report = report.slice(0, 60000) + '\n... (truncated)';
            }
            const title = "Link check failure report";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // The check fails for two unrelated reasons, and the report must not
            // conflate them: a broken external link is adjudicated by the browser,
            // while a markup or internal-reference failure bypasses tier 2 entirely
            // (a markup-only run exits before Chromium even starts).
            const body =
              `The two-tier link check failed. See the report below for which category.\n\n` +
              `- Workflow run: ${runUrl}\n` +
              `- Branch/ref: ${context.ref}\n` +
              `- Commit: ${context.sha}\n\n` +
              `Report:\n\`\`\`\n${report}\n\`\`\`\n\n` +
              `**How to read this report**\n\n` +
              `- **Broken links** — listed under 'need manual attention'. These failed ` +
              `htmltest AND browser verification, so the URL is genuinely unreachable. ` +
              `Links that work in a real browser (403s, bot detection) and hosts returning ` +
              `5xx are reported as context but do not fail the check.\n` +
              `- **Markup, accessibility or internal-reference failures** — listed under ` +
              `'browser verification cannot excuse'. A browser cannot adjudicate these: a ` +
              `referenced image may answer 200 while its alt attribute is still missing. ` +
              `They fail on their own and never reach tier 2, so do not expect browser ` +
              `results for them.\n\n` +
              `Either category can be present without the other. Review the job logs for details.`;

            // Find an existing open issue with the exact title.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }
